name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install dependencies
        run: npm ci

      - name: Build (secrets injected by Doppler)
        # Doppler fetches all secrets from the njcoast project (prd config)
        # and injects them as environment variables for the build step.
        # Add secrets in Doppler dashboard: https://dashboard.doppler.com
        # Required secrets: VITE_POSTHOG_KEY, VITE_POSTHOG_HOST,
        #   VITE_GOOGLE_MAPS_API_KEY, VITE_GOOGLE_MAPS_MAP_ID,
        #   VITE_GEMINI_API_KEY, VITE_VERTEX_SEARCH_PROJECT_ID,
        #   VITE_VERTEX_SEARCH_LOCATION, VITE_VERTEX_SEARCH_DATA_STORE,
        #   VITE_VERTEX_SEARCH_API_KEY
        run: doppler run --project njcoast --config prd -- npm run build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

